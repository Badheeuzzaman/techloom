name: Build and deploy Task 02

on:
  pull_request:
    paths:
      - "task-01/**"
      - "task-02/**"
      - "render.yaml"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "task-01/**"
      - "task-02/**"
      - "render.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Build frontend and verify backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            task-02/backend/package-lock.json
            task-02/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: task-02/backend
        run: npm ci

      - name: Verify backend starts
        working-directory: task-02/backend
        shell: bash
        run: |
          node src/server.js > /tmp/task-02-api.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/task-02-api.log
          exit 1

      - name: Install frontend dependencies
        working-directory: task-02/frontend
        run: npm ci

      - name: Build frontend
        working-directory: task-02/frontend
        env:
          VITE_API_URL: https://task-02-api.onrender.com/api
        run: npm run build

      - name: Check Task 01 backend
        working-directory: task-01/backend
        run: |
          node --check src/server.js
          node --check src/app.js

      - name: Install Task 01 frontend dependencies
        working-directory: task-01/frontend
        run: npm ci

      - name: Build Task 01 frontend
        working-directory: task-01/frontend
        env:
          VITE_API_URL: https://task-01-api.onrender.com/api
        run: npm run build

  deploy:
    name: Trigger Render deploys
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
          fi

      - name: Trigger Render frontend deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
          fi

      - name: Trigger Task 01 backend deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_TASK_01_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
          fi

      - name: Trigger Task 01 frontend deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_TASK_01_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
          fi
