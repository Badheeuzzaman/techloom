name: Validate and deploy Task 01

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "task-01/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "task-01/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: task-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Validate backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-01/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-01/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        shell: bash
        run: |
          node --check src/config/db.js
          node --check src/controllers/productController.js
          node --check src/services/orderService.js
          node --check src/server.js

  validate-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-01/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-01/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

  deploy-backend:
    name: Deploy backend to Netlify
    needs: [validate-backend, validate-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-01/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: task-01/backend
        run: npm ci

      - name: Deploy backend to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_BACKEND_SITE_ID: ${{ secrets.NETLIFY_BACKEND_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_BACKEND_SITE_ID" ]; then
            echo "Netlify backend secrets are not fully configured. Skipping backend deployment."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir=task-01/backend --site="$NETLIFY_BACKEND_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"

  deploy-frontend:
    name: Deploy frontend to Netlify
    needs: [validate-backend, validate-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-01/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-01/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Deploy frontend to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_FRONTEND_SITE_ID: ${{ secrets.NETLIFY_FRONTEND_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_FRONTEND_SITE_ID" ]; then
            echo "Netlify secrets are not fully configured. Skipping frontend deployment."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir=dist --site="$NETLIFY_FRONTEND_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
