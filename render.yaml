services:
  - type: web
    name: task-01-api
    runtime: node
    rootDir: task-01/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: pos_inventory
      - key: CORS_ORIGIN
        sync: false
      - key: RESERVATION_MINUTES
        value: 5
      - key: RESERVATION_SWEEP_INTERVAL_MS
        value: 15000

  - type: static
    name: task-01-frontend
    rootDir: task-01/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: task-02-api
    runtime: node
    rootDir: task-02/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: RESERVATION_TIMEOUT_MS
        value: 300000

  - type: static
    name: task-02-frontend
    rootDir: task-02/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
